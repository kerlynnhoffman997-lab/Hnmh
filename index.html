<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171e24">
  <meta name="description" content="从河南地图进入18个地区、19场庙会，逐层探索场景、演出、活动、摊位与物件背后的地方故事。">
  <title>赶一场中原庙会</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="host.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="sound.css">
  <link rel="stylesheet" href="interaction.css">
  <link rel="stylesheet" href="home-layout.css">
  <link rel="stylesheet" href="ui-components.css">
  <link rel="stylesheet" href="ui-dialogs.css">
  <link rel="stylesheet" href="map-folk.css">
  <link rel="stylesheet" href="home-editorial.css">
  <link rel="stylesheet" href="map-feature.css">
  <link rel="stylesheet" href="visit-polish.css">
  <link rel="stylesheet" href="visitor-memory.css">
  <link rel="stylesheet" href="clay-trail.css">
  <link rel="stylesheet" href="clay-souvenir.css">
</head>
<body class="booting">
  <section id="opening-state" role="status" aria-live="polite" aria-label="打开庙会画卷">
    <small>赶一场中原庙会</small><h1>画卷正在展开</h1><div class="opening-line" aria-hidden="true"></div>
    <p>从一方水土，走进人间烟火。</p>
    <div class="opening-actions" hidden><button type="button">重新打开</button><a href="./">回到河南地图</a></div>
    <noscript>请启用浏览器的 JavaScript 后查看交互作品。</noscript>
  </section>
  <script src="boot-state.js"></script>
  <main id="province-home" aria-label="河南庙会地图"></main>
  <iframe id="viewer" src="viewer.html" title="赶一场中原庙会：从河南地图逐层探索地方文化" allow="fullscreen" allowfullscreen></iframe>
  <a id="review-qr" class="review-qr" href="assets/review-qr.svg" target="_blank" rel="noopener" aria-label="扫码查看交互作品，点击打开二维码大图">
    <img src="assets/review-qr.svg" width="144" height="144" alt="赶一场中原庙会在线作品二维码">
    <span>扫码查看作品</span>
    <small>手机体验 · 点击查看大图</small>
  </a>

  <dialog id="host-share" aria-labelledby="share-heading">
    <div class="dialog-heading">
      <div><p class="eyebrow">把这一处分享出去</p><h1 id="share-heading">分享当前场景</h1></div>
      <button class="icon-close" type="button" data-close-host aria-label="关闭分享">×</button>
    </div>
    <p id="share-context" class="muted"></p>
    <label class="field-label" for="share-url">场景链接</label>
    <input id="share-url" readonly spellcheck="false" inputmode="url">
    <div class="dialog-actions">
      <p id="copy-result" role="status" aria-live="polite"></p>
      <button id="copy-link" type="button" class="primary-button">复制链接</button>
    </div>
  </dialog>

  <div id="host-status" class="host-status" role="status" aria-live="polite" hidden></div>
  <script src="vendor/motion/motion-mini.js"></script>
  <script src="fair-motion.js"></script>
  <script src="sound.js"></script>
  <script src="home-editorial-data.js"></script>
  <script src="home-editorial.js"></script>
  <script src="map-feature-data.js"></script>
  <script src="map-feature.js"></script>
  <script src="fair-trails-data.js"></script>
  <script src="home.js"></script>
  <script src="picture-navigation.js"></script>
  <script src="journey-navigation.js"></script>
  <script src="visitor-memory.js"></script>
  <script src="story-continuation.js"></script>
  <script src="clay-souvenir.js"></script>
  <script src="clay-trail.js"></script>
  <script src="fair-trails.js"></script>
  <script src="host.js"></script>
</body>
</html>
