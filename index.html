<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171e24">
  <meta name="description" content="从河南地图进入18个地区、19场庙会，逐层探索场景、演出、活动、摊位与物件背后的地方故事。">
  <title>赶一场中原庙会</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="host.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="sound.css">
</head>
<body>
  <main id="province-home" aria-label="河南庙会地图"></main>
  <iframe id="viewer" src="viewer.html" title="赶一场中原庙会：从河南地图逐层探索地方文化" allow="fullscreen" allowfullscreen></iframe>
  <a id="review-qr" class="review-qr" href="assets/review-qr.svg" target="_blank" rel="noopener" aria-label="扫码查看交互作品，点击打开二维码大图">
    <img src="assets/review-qr.svg" width="144" height="144" alt="赶一场中原庙会在线作品二维码">
    <span>扫码查看作品</span>
    <small>手机体验 · 点击查看大图</small>
  </a>

  <dialog id="host-share" aria-labelledby="share-heading">
    <div class="dialog-heading">
      <div><p class="eyebrow">把这一处分享出去</p><h1 id="share-heading">分享当前场景</h1></div>
      <button class="icon-close" type="button" data-close-host aria-label="关闭分享">×</button>
    </div>
    <p id="share-context" class="muted"></p>
    <label class="field-label" for="share-url">场景链接</label>
    <input id="share-url" readonly spellcheck="false" inputmode="url">
    <div class="dialog-actions">
      <p id="copy-result" role="status" aria-live="polite"></p>
      <button id="copy-link" type="button" class="primary-button">复制链接</button>
    </div>
  </dialog>

  <div id="host-status" class="host-status" role="status" aria-live="polite" hidden></div>
  <script src="sound.js"></script>
  <script src="home.js"></script>
  <script src="picture-navigation.js"></script>
  <script src="host.js"></script>
</body>
</html>
